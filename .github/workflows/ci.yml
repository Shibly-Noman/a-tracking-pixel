name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript workspaces ────────────────────────────────────────────────────

  ts-lint-test:
    name: TypeScript (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Test
        run: pnpm turbo test -- --ci --coverage

  # ── Go services ──────────────────────────────────────────────────────────────

  go-lint-test:
    name: Go services (lint + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion-api, event-transformer, attribution-engine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download deps
        run: go mod download
        working-directory: services/${{ matrix.service }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
          working-directory: services/${{ matrix.service }}

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
        working-directory: services/${{ matrix.service }}

  # ── Docker builds ────────────────────────────────────────────────────────────

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [ts-lint-test, go-lint-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service:
          - { name: ingestion-api, context: services/ingestion-api }
          - { name: event-transformer, context: services/event-transformer }
          - { name: attribution-engine, context: services/attribution-engine }
          - { name: query-api, context: apps/query-api }
          - { name: dashboard, context: apps/dashboard }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
